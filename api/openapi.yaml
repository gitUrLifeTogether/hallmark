openapi: 3.1.0
info:
  title: Hallmark API
  version: 0.1.0
  description: >
    HTTP API for the Hallmark console. Source of truth for TypeScript types
    (generated via openapi-typescript) and Pydantic request/response models.
    Endpoints are listed in CLAUDE.md §14; fleshed out starting M3.
servers:
  - url: https://api.hallmark.example/v1
paths: {}
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
