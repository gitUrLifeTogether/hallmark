# The service block below (port 4566, the docker.sock mount, the /var/lib/localstack
# volume and the _localstack/health check) follows LocalStack's own documented
# docker-compose example: https://docs.localstack.cloud/getting-started/installation/
# The environment tuning and the healthcheck timings are ours.
services:
  localstack:
    # Pinned tag (CLAUDE.md §0.0.3.2). Bump deliberately, never with :latest.
    image: localstack/localstack:4.9.1
    container_name: hallmark-localstack
    ports:
      - "4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?set LOCALSTACK_AUTH_TOKEN in .env}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      PERSISTENCE: 0
      # Lambda containers must reach Ollama running on the host (CLAUDE.md §0.0.2).
      LAMBDA_DOCKER_FLAGS: "--add-host=host.docker.internal:host-gateway"
      # 8 GB host: keep Lambda containers from piling up (see docs/decisions.md ADR-0004).
      LAMBDA_REMOVE_CONTAINERS: 1
      LAMBDA_KEEPALIVE_MS: 60000
    volumes:
      - "./.localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
