[project]
name = "hallmark"
version = "0.1.0"
description = "Provenance-aware firewall for AI agents"
requires-python = ">=3.12"
dependencies = [
  "strands-agents>=0.1",
  "boto3>=1.35",
  "cedarpy>=1.1",
  "pydantic>=2.9",
  "aws-lambda-powertools>=3.2",
  "python-ulid>=2.7",
  "nh3>=0.2",
  "beautifulsoup4>=4.12",
  "pypdf>=5.1",
  "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.115",
  "mypy>=1.14",
  "ruff>=0.8",
  "moto[all]>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM", "UP", "S", "C901"]
mccabe.max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of a test, and test fixtures are not production surface.
"tests/**" = ["S101"]
# Fixture content deliberately contains invented account numbers and addresses.
"fixtures/**" = ["S105", "S106"]
# Throwaway M0 spike functions; the URL they open is a localhost address we construct.
"spike/**" = ["S310"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["hallmark"]

# boto3 ships no type information. It is reached only through the guarded factory in
# config.py, so the untyped import is contained to one call site.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "cedarpy", "cedarpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
