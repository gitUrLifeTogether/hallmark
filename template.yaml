AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Hallmark — provenance-aware policy enforcement for AI agents.
  M0 skeleton: hello-world HTTP API only. No account IDs, ARNs, model IDs
  or regions are hardcoded here; everything comes from parameters and environment.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, demo]
  TenantId:
    Type: String
    Default: kestrel

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        STAGE: !Ref Stage
        TENANT_ID: !Ref TenantId

Resources:
  # REST API (v1), not HTTP API (v2). The emulator this runs against does not provide
  # apigatewayv2 on the free plan: CloudFormation reports the stage as "deployed as a
  # fallback" and every call to the service then fails. REST v1 is fully emulated.
  HallmarkApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      EndpointConfiguration:
        Type: REGIONAL

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: handlers/api/
      Handler: hello.handler
      Events:
        Hello:
          Type: Api
          Properties:
            RestApiId: !Ref HallmarkApi
            Path: /hello
            Method: GET

Outputs:
  ApiId:
    Description: REST API id, for building local URLs
    Value: !Ref HallmarkApi
  ApiUrl:
    Description: Base URL of the REST API
    Value: !Sub "https://${HallmarkApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
